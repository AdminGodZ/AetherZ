[package]
name = "aetherz-trainer"
version = "0.1.0"
edition = "2024"
publish = false
description = "Trains AetherZ's (768 -> 256)x2 -> 1 NNUE with bullet"

# Standalone crate, not part of any parent workspace.
[workspace]

[dependencies]
# Pinned to the bullet commit this trainer was built and tested with.
bullet = { git = "https://github.com/jw1912/bullet", rev = "5d70177680437b7c0ddf958bd4722d95afa78b0c", package = "bullet_lib" }

[features]
default = ["cuda"]
cuda = ["bullet/cuda"]
rocm = ["bullet/rocm"]
metal = ["bullet/metal"]
